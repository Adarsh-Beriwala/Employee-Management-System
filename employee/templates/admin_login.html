<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: url('https://images.unsplash.com/photo-1492724441997-5dc865305da7') no-repeat center center/cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: rgba(0,0,0,0.75);
            padding: 35px;
            border-radius: 12px;
            width: 320px;
            color: white;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: none;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #218838;
        }

        .error {
            color: #ff6b6b;
            margin-top: 10px;
        }

        .links {
            margin-top: 15px;
        }

        .links a {
            color: #ddd;
            text-decoration: none;
            font-size: 14px;
        }

        .links a:hover {
            color: white;
        }
    </style>
</head>

<body>

<div class="login-box">
    <h2>Admin Login</h2>

    <form method="POST">
        {% csrf_token %}
        
        <input type="text" name="username" placeholder="Admin Username" required>
        <input type="password" name="password" placeholder="Password" required>
        
        <button type="submit">Login</button>
    </form>

    <!-- ❌ Error message -->
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <!-- 🔗 Navigation -->
    <div class="links">
        <a href="/login/">Employee Login</a> |
        <a href="/signup/">Employee Signup</a> |
        <a href="/">Home</a>
    </div>
</div>

</body>
</html>
